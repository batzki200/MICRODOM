services:
  web:
    build: .
    container_name: microdom-web
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025

  mailpit:
    image: axllent/mailpit
    container_name: microdom-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"